  try { await sendPasswordResetEmail(auth, r.u.ae); alert(r.u.ae.toLowerCase().startsWith(String(CFGA.adminMail || '-').split('@')[0].toLowerCase() + '+') ? 'আপনার Gmail ইনবক্সে (স্প্যামও দেখুন) ইমেইল গেছে। লিংক খুলে নতুন পাসওয়ার্ড বসান, তারপর এখানে সেই পাসওয়ার্ড লিখে WhatsApp-এ পাঠান।' : 'ইমেইলটি ব্যবহারকারীর নিজের ইমেইলে গেছে। তাঁকে WhatsApp-এ জানান লিংক চাপতে।'); }
  catch (e) { alert('পাঠানো যায়নি: ' + (e.code || e.message)); }
};
A.rwa = async id => {
  const r = RL.find(x => x.id === id), pw = ($('np_' + id).value || '').trim();
  if (pw.length < 6) return alert('কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড লিখুন (ইমেইলের লিংকে যেটা বসিয়েছেন সেটাই)');
  window.open('https://wa.me/' + waNum(r.whatsapp) + '?text=' + encodeURIComponent('মাঠের হাট: আপনার নতুন পাসওয়ার্ড: ' + pw + '\nলগইন করে প্রোফাইল → নিরাপত্তা থেকে নিজের পছন্দের পাসওয়ার্ড দিয়ে বদলে নিন।'), '_blank');
  if (confirm('WhatsApp-এ পাঠানো হয়ে গেলে "OK" চাপুন, আবেদনটি সম্পন্ন হিসেবে চিহ্নিত হবে।')) A.rdone(id);
};
A.rdone = async id => { await updateDoc(doc(db, 'resetRequests', id), { status: 'done' }); V.rst(); };
A.rdel = async id => { if (confirm('আবেদনটি মুছবেন?')) { await deleteDoc(doc(db, 'resetRequests', id)); V.rst(); } };

/* ---------- সেটিংস: রিসেট ইমেইল, WhatsApp, AI কী ---------- */
V.cfg = async () => {
  await getCfg(); let ai = {}; try { const s = await getDoc(doc(db, 'config', 'ai')); ai = s.exists() ? s.data() : {}; } catch { }
  $('m').innerHTML = `<h2>সেটিংস</h2><div class="card" style="max-width:560px"><h3>🔑 পাসওয়ার্ড রিসেট</h3><label>আপনার Gmail</label><input id="cm" type="email" placeholder="yourname@gmail.com" value="${esc(CFGA.adminMail || '')}"><p style="color:var(--mut);font-size:14px;margin:4px 0">নতুন ব্যবহারকারীদের লগইন ঠিকানা হবে yourname+নম্বর@gmail.com, তাই রিসেটের ইমেইল সবসময় আপনার ইনবক্সে আসবে। <b>নতুন নিবন্ধন শুরুর আগেই এটা সেট করুন।</b> পরে বদলালে আগের ব্যবহারকারীদের রিসেট ইমেইল আগের ঠিকানাতেই যাবে।</p><label>আপনার WhatsApp নম্বর</label><input id="cw" inputmode="numeric" placeholder="01XXXXXXXXX" value="${esc(CFGA.adminWa || '')}"><p style="color:var(--mut);font-size:14px;margin:4px 0">আবেদনের পর ব্যবহারকারী এই নম্বরে আপনাকে বার্তা পাঠাতে পারবেন।</p>
<h3 style="margin-top:20px">🔬 রোগ শনাক্তের AI (ফ্রি)</h3><label>Gemini API Key</label><input id="ck" type="password" placeholder="${ai.key ? 'সেভ করা আছে, বদলাতে নতুন কী লিখুন' : 'AIza… (aistudio.google.com/apikey থেকে ফ্রি)'}"><label>মডেল</label><input id="cd" placeholder="gemini-flash-latest" value="${esc(ai.model || '')}"><p style="color:var(--mut);font-size:14px;margin:4px 0">কী পেতে aistudio.google.com/apikey → Create API key। কী ফাঁকা রাখলে AI বন্ধ থাকবে, ব্যবহারকারী শুধু নিজে খুঁজে নেওয়ার তালিকা পাবেন। কীটি লগইন করা ব্যবহারকারীরা দেখতে পারে, তাই Google Cloud Console → Credentials-এ কীটি শুধু আপনার সাইটের ঠিকানায় সীমাবদ্ধ করে দিন।</p><button data-a="cfgsave" style="width:100%;margin-top:10px">সংরক্ষণ করুন</button></div>`;
};
A.cfgsave = async () => {
  const m = $('cm').value.trim().toLowerCase(), w = $('cw').value.trim(), k = $('ck').value.trim(), md = $('cd').value.trim();
  if (m && !/^[^@\s'"\\+]+@gmail\.com$/.test(m)) return alert('Gmail ঠিকানা দিন (শুধু @gmail.com, ঠিকানায় + থাকবে না)');
  if (w && !/^01[3-9]\d{8}$/.test(w)) return alert('WhatsApp নম্বর সঠিক নয়');
  try {
    await setDoc(doc(db, 'config', 'app'), { adminMail: m, adminWa: w }, { merge: true });
    const ai = { model: md }; if (k) ai.key = k; await setDoc(doc(db, 'config', 'ai'), ai, { merge: true });
    alert('সংরক্ষিত ✅'); V.cfg();
  } catch (e) { alert('সংরক্ষণ হয়নি। Firestore নিয়ম নতুন করে বসানো হয়েছে কি দেখুন (ওয়েবসাইটের /#setup)।'); }
};

/* ---------- স্বয়ংক্রিয় পরিষ্কার: অ্যাডমিন প্যানেল খুললেই চলে ---------- */
async function rmPost(p, reason) {
  await deleteDoc(doc(db, 'products', p.id));
  if (reason) await addDoc(col('violations'), { uid: p.sellerId, name: p.sellerName, title: p.title, reason, at: serverTimestamp() }).catch(() => {});
}
async function sweep() {
  let n = 0;
  for (const p of await rows('products', 'createdAt', 100)) if (BAD.test((p.title || '') + ' ' + (p.description || ''))) { await rmPost(p, 'অটো-ডিলিট: নিষিদ্ধ শব্দ'); n++; }
  const c = {}; (await getDocs(col('reports'))).docs.forEach(d => { const r = d.data(); c[r.pid] = (c[r.pid] || 0) + 1; });
  for (const pid in c) if (c[pid] >= 3) { const s = await getDoc(doc(db, 'products', pid)); if (s.exists()) { await rmPost({ id: pid, ...s.data() }, 'অটো-ডিলিট: ৩+ রিপোর্ট'); n++; } }
  const v = {}; (await getDocs(col('violations'))).docs.forEach(d => { const x = d.data(); v[x.uid] = (v[x.uid] || 0) + 1; });
  for (const id in v) if (v[id] >= 3) await updateDoc(doc(db, 'users', id), { banned: true }).catch(() => {});
  return n;
}

/* ---------- পোস্ট: বিভাগ → জেলা → উপজেলা ফিল্টার ---------- */
const uniq = a => [...new Set(a.filter(Boolean))].sort();
const sel = (c, arr, cur, ph) => `<select data-c="${c}"><option value="">${ph}</option>${arr.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
V.posts = async () => { PL = await rows('products', 'createdAt', 100); drawPosts(); };
function drawPosts() {
  const byV = PL.filter(p => !FIL.v || p.division === FIL.v), byD = byV.filter(p => !FIL.d || p.district === FIL.d), L = byD.filter(p => !FIL.u || p.upazila === FIL.u), cnt = {};
  byD.forEach(p => cnt[p.upazila] = (cnt[p.upazila] || 0) + 1);
  $('m').innerHTML = `<h2>পোস্ট (${L.length}টি)</h2><div class="card"><div class="row">${sel('fv', uniq(PL.map(p => p.division)), FIL.v, 'সব বিভাগ')}${sel('fd', uniq(byV.map(p => p.district)), FIL.d, 'সব জেলা')}${sel('fu', uniq(byD.map(p => p.upazila)), FIL.u, 'সব উপজেলা')}</div><div>উপজেলা অনুযায়ী: ${Object.entries(cnt).map(([u, n]) => `<span class="tag" style="cursor:pointer;margin:2px" data-a="fu" data-v="${esc(u)}">${esc(u)}: ${n}</span>`).join('') || '—'}</div></div>
<div class="card"><table><tr><th></th><th>পণ্য</th><th>বিক্রেতা ও এলাকা</th><th>অবস্থা</th><th></th></tr>${L.map(p => `<tr><td>${p.images?.[0] ? `<img class="th" src="${esc(p.images[0])}" alt="">` : ''}</td><td>${esc(p.title)}<br><small>${esc(p.category)} • ৳${p.price}/${esc(p.unit)}<br>${esc(p.description || '').slice(0, 80)}</small></td><td>${esc(p.sellerName)}<br><small>${esc(p.upazila)}, ${esc(p.district)}, ${esc(p.division)}</small></td><td><span class="tag">${p.status === 'active' ? 'চালু' : 'লুকানো'}</span></td>
<td><button class="alt" data-a="pst" data-v="${p.id}|${p.status === 'active' ? 'hidden' : 'active'}">${p.status === 'active' ? 'লুকান' : 'চালু'}</button> <button class="del" data-a="pdel" data-v="${p.id}|0">মুছুন</button> <button class="del" data-a="pdel" data-v="${p.id}|1" title="মুছে বিক্রেতাকে সতর্ক করুন">🚫 ১৮+</button></td></tr>`).join('') || '<tr><td colspan="5">কোনো পোস্ট নেই</td></tr>'}</table></div>`;
}
A.fv = v => { FIL = { v, d: '', u: '' }; drawPosts(); }; A.fd = v => { FIL.d = v; FIL.u = ''; drawPosts(); }; A.fu = v => { FIL.u = v; drawPosts(); };
A.pst = async v => { const [id, s] = v.split('|'); await updateDoc(doc(db, 'products', id), { status: s }); PL.find(x => x.id === id).status = s; drawPosts(); };
A.pdel = async v => { const [id, strike] = v.split('|'), p = PL.find(x => x.id === id); if (!confirm(strike === '1' ? 'পোস্ট মুছে বিক্রেতার নামে স্ট্রাইক দেবেন? (৩ স্ট্রাইকে অ্যাকাউন্ট বন্ধ)' : 'পোস্ট মুছবেন?')) return; await rmPost(p, strike === '1' ? 'অ্যাডমিন: ১৮+/নীতিবিরোধী' : ''); PL = PL.filter(x => x.id !== id); TAB === 'mod' ? V.mod() : drawPosts(); };

V.dash = async () => {
  const c = async q => (await getCountFromServer(q)).data().count;
  const [u, p, o, q, v, r] = await Promise.all([c(col('users')), c(col('products')), c(col('orders')), c(query(col('questions'), where('answer', '==', ''))), c(col('violations')), c(col('reports'))]);
  $('m').innerHTML = `<h2>ড্যাশবোর্ড</h2><div class="stats">${[['সদস্য', u], ['পোস্ট', p], ['অর্ডার', o], ['উত্তরহীন প্রশ্ন', q], ['নীতিভঙ্গের লগ', v], ['রিপোর্ট', r]].map(x => `<div class="card stat"><b>${x[1]}</b>${x[0]}</div>`).join('')}</div>`;
};
V.users = async () => {
  const L = await rows('users'), vs = await rows('violations', 'at', 500), c = {}; vs.forEach(v => c[v.uid] = (c[v.uid] || 0) + 1);
  $('m').innerHTML = `<h2>সদস্য</h2><div class="card"><table><tr><th>নাম</th><th>মোবাইল</th><th>এলাকা</th><th>ধরন</th><th>নীতিভঙ্গ</th><th></th></tr>${L.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>${esc(u.village ? u.village + ', ' : '')}${esc(u.upazila)}, ${esc(u.district)}</td><td>${esc(u.type)}</td><td>${c[u.id] || 0}</td><td><button class="${u.banned ? '' : 'del'}" data-a="ban" data-v="${u.id}|${u.banned ? 0 : 1}">${u.banned ? 'চালু করুন' : 'বন্ধ করুন'}</button></td></tr>`).join('')}</table></div>`;
};
A.ban = async v => { const [id, b] = v.split('|'); await updateDoc(doc(db, 'users', id), { banned: b === '1' }); V.users(); };
V.mod = async () => {
  const vs = await rows('violations', 'at', 100), c = {}; (await getDocs(col('reports'))).docs.forEach(d => { const r = d.data(); c[r.pid] = (c[r.pid] || 0) + 1; });
  const it = (await Promise.all(Object.keys(c).map(async pid => { const s = await getDoc(doc(db, 'products', pid)); return s.exists() ? { id: pid, ...s.data(), n: c[pid] } : null; }))).filter(Boolean);
  PL = it;
  $('m').innerHTML = `<h2>নীতিমালা ও রিপোর্ট</h2><div class="card"><h3>🚩 রিপোর্ট হওয়া পোস্ট (৩টি রিপোর্টে অটো-ডিলিট)</h3>${it.map(p => `<div style="padding:6px 0;border-bottom:1px solid var(--bd)">${p.images?.[0] ? `<img class="th" src="${esc(p.images[0])}" alt=""> ` : ''}<b>${esc(p.title)}</b> • ${esc(p.upazila)} • ${p.n}টি রিপোর্ট <button class="del" data-a="pdel" data-v="${p.id}|1">🚫 মুছুন</button> <button class="alt" data-a="rclr" data-v="${p.id}">ঠিক আছে</button></div>`).join('') || '<p>কিছু নেই</p>'}</div>
<div class="card"><h3>বাতিল ও মুছে ফেলা পোস্টের লগ</h3><table><tr><th>সময়</th><th>বিক্রেতা</th><th>পোস্ট</th><th>কারণ</th></tr>${vs.map(l => `<tr><td>${dt(l.at)}</td><td>${esc(l.name)}</td><td>${esc(l.title)}</td><td>${esc(l.reason)}</td></tr>`).join('') || '<tr><td colspan="4">কিছু নেই</td></tr>'}</table></div>`;
};
A.rclr = async pid => { const s = await getDocs(query(col('reports'), where('pid', '==', pid))); for (const d of s.docs) await deleteDoc(d.ref); V.mod(); };
V.ann = async () => {
  const L = await rows('announcements', 'at', 20);
  $('m').innerHTML = `<h2>ঘোষণা (সবার ফোনে পপআপ)</h2><div class="card"><div class="row"><input id="at" placeholder="শিরোনাম (যেমন: আজ ধানের দাম বেড়েছে)"></div><div class="row"><textarea id="ax" rows="3" placeholder="বিস্তারিত…"></textarea></div><div class="row"><input id="al" placeholder="লিংক (ঐচ্ছিক), যেমন https://… — পপআপে ট্যাপ করলে এখানে যাবে"></div><button data-a="aadd">সবাইকে পাঠান</button><p style="color:var(--mut)">যাদের সাইট এখন খোলা আছে তারা সাথে সাথে পপআপ পাবেন, বাকিরা সাইটে ঢুকলে পাবেন।</p></div><div class="card"><table><tr><th>সময়</th><th>ঘোষণা</th><th></th></tr>${L.map(x => `<tr><td>${dt(x.at)}</td><td><b>${esc(x.title)}</b><br>${esc(x.text)}${x.link ? `<br><a href="${esc(x.link)}" target="_blank" rel="noopener">🔗 ${esc(x.link).slice(0, 40)}</a>` : ''}</td><td><button class="del" data-a="adel" data-v="${x.id}">মুছুন</button></td></tr>`).join('') || '<tr><td colspan="3">কোনো ঘোষণা নেই</td></tr>'}</table></div>`;
};
A.aadd = async () => { const t = $('at').value.trim(), l = ($('al').value || '').trim(); if (!t) return alert('শিরোনাম দিন'); if (l && !/^https?:\/\/\S+$/i.test(l)) return alert('লিংক https:// দিয়ে শুরু হতে হবে'); const d = { title: t.slice(0, 80), text: $('ax').value.trim().slice(0, 300), at: serverTimestamp() }; if (l) d.link = l.slice(0, 300); await addDoc(col('announcements'), d); V.ann(); };
A.adel = async id => { await deleteDoc(doc(db, 'announcements', id)); V.ann(); };
V.qs = async () => {
  const L = await rows('questions', 'createdAt', 50);
  $('m').innerHTML = `<h2>কৃষকের প্রশ্ন</h2>${L.map(q => `<div class="card"><b>${esc(q.text)}</b><div style="color:var(--mut)">${dt(q.createdAt)}</div><textarea id="a_${q.id}" rows="3" style="margin-top:8px" placeholder="উত্তর লিখুন…">${esc(q.answer)}</textarea><div class="row"><button data-a="qs" data-v="${q.id}">উত্তর প্রকাশ</button><button class="del" data-a="qdel" data-v="${q.id}">মুছুন</button></div></div>`).join('') || '<p>কোনো প্রশ্ন নেই</p>'}`;
};
A.qs = async id => { await updateDoc(doc(db, 'questions', id), { answer: $('a_' + id).value.trim(), answeredBy: 'admin', answeredAt: serverTimestamp() }); alert('প্রকাশিত'); };
A.qdel = async id => { if (confirm('মুছবেন?')) { await deleteDoc(doc(db, 'questions', id)); V.qs(); } };
V.prices = async () => {
  const L = await rows('prices', 'createdAt', 50);
  $('m').innerHTML = `<h2>বাজার দর</h2><div class="card"><div class="row"><input id="pc" placeholder="পণ্য (যেমন: আমন ধান)"><input id="pm" placeholder="বাজার (যেমন: নেত্রকোনা)"><input id="pp" type="number" placeholder="দাম ৳"><input id="pu" placeholder="একক (মণ/কেজি)"></div><button data-a="padd">দর যোগ করুন</button></div><div class="card"><table><tr><th>পণ্য</th><th>বাজার</th><th>দাম</th><th>তারিখ</th><th></th></tr>${L.map(p => `<tr><td>${esc(p.crop)}</td><td>${esc(p.market)}</td><td>৳${p.price}/${esc(p.unit)}</td><td>${dt(p.createdAt)}</td><td><button class="del" data-a="pdl" data-v="${p.id}">মুছুন</button></td></tr>`).join('')}</table></div>`;
};
A.padd = async () => { const p = +$('pp').value; if (!$('pc').value.trim() || !p) return alert('পণ্য ও দাম দিন'); await addDoc(col('prices'), { crop: $('pc').value.trim(), market: $('pm').value.trim(), price: p, unit: $('pu').value.trim() || 'মণ', createdAt: serverTimestamp() }); V.prices(); };
A.pdl = async id => { await deleteDoc(doc(db, 'prices', id)); V.prices(); };
</script>
