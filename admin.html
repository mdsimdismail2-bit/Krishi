<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230f4c2a%27/%3E%3Ctext y=%27.72em%27 x=%2712%27 font-size=%2772%27%3E🌾%3C/text%3E%3C/svg%3E">
<title>মাঠের হাট – অ্যাডমিন প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f2;--card:#fff;--tx:#12201a;--mut:#5d6f65;--pri:#14532d;--prit:#fff;--bd:#d5e2d9;--soft:#e4f0e7;--red:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a13;--card:#162a1e;--tx:#e8f2ec;--mut:#9bb3a5;--pri:#5fd08a;--prit:#08210f;--bd:#27412f;--soft:#1d3626;--red:#ff8a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 'Hind Siliguri',system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--pri);color:var(--prit);padding:16px 10px}aside h2{margin:0 8px 14px;font-size:19px}
aside a{display:block;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;font-weight:600;cursor:pointer}aside a.on,aside a:hover{background:rgba(255,255,255,.18)}
main{padding:20px;overflow-x:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat b{font-size:30px;color:var(--pri);display:block;line-height:1.2}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--pri);background:var(--pri);color:var(--prit);padding:6px 12px;border-radius:8px}button.alt{background:transparent;color:var(--pri)}button.del{background:transparent;color:var(--red);border-color:var(--red)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:120px}
.tag{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--pri)}
img.th{width:56px;height:56px;object-fit:cover;border-radius:8px}
#login{max-width:360px;margin:12vh auto}
@media(max-width:720px){.wrap{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap;gap:4px}aside h2{width:100%}}
.lg{display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:6px}.lg svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, addDoc, deleteDoc, updateDoc, setDoc, collection, query, orderBy, limit, getDocs, getCountFromServer, where, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyAlAYaKVYs5eEWD69ATTMLnkkJOq98RhfA",
  authDomain: "krishi-4b93c.firebaseapp.com",
  projectId: "krishi-4b93c",
  storageBucket: "krishi-4b93c.firebasestorage.app",
  messagingSenderId: "110396719763",
  appId: "1:110396719763:web:879304e4e8b757b0244366"
};
const fb = initializeApp(firebaseConfig), auth = getAuth(fb), db = getFirestore(fb);
const $ = i => document.getElementById(i), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const col = n => collection(db, n), dt = t => t?.seconds ? new Date(t.seconds * 1000).toLocaleString('bn-BD') : '';
const LOGO = '<div style="width:100%;aspect-ratio:1;border-radius:26px;background:linear-gradient(135deg,#0f4c2a,#1f7a45);display:flex;align-items:center;justify-content:center;font-size:52px">🌾</div>';
const BAD = /(sex|porn|xxx|nude|naked|escort|erotic|18\s*\+|সেক্স|পর্ন|ন্যুড|নগ্ন|যৌন)/i;
let TAB = 'posts', A = {}, V = {}, PL = [], FIL = { v: '', d: '', u: '' };
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset.v, b); });
document.addEventListener('change', e => { const b = e.target.closest('[data-c]'); if (b && A[b.dataset.c]) A[b.dataset.c](b.value); });
const rows = async (n, o = 'createdAt', l = 300) => (await getDocs(query(col(n), orderBy(o, 'desc'), limit(l)))).docs.map(d => ({ id: d.id, ...d.data() }));

onAuthStateChanged(auth, async u => {
  if (!u) return loginView();
  let ok = true;
  try { await getDocs(query(col('users'), limit(1))); } catch { ok = false; }
  if (!ok) return uidView(u);
  shell(); sweep().then(n => { if (n) { alert(n + 'টি নীতিমালা-বিরোধী পোস্ট স্বয়ংক্রিয়ভাবে মুছে ফেলা হয়েছে'); V[TAB](); } });
});
function loginView(msg) { $('root').innerHTML = `<div class="card" id="login"><div style="text-align:center"><div style="width:84px;margin:auto">${LOGO}</div><h2 style="margin:8px 0 4px">অ্যাডমিন লগইন</h2></div><p style="color:var(--red)">${msg || ''}</p><button data-a="glogin" style="width:100%">🔐 Google (Gmail) দিয়ে লগইন</button><div style="text-align:center;color:var(--mut);margin:12px 0">অথবা মোবাইল নম্বর ও পাসওয়ার্ড (ওয়েবসাইটে নিবন্ধনের সময় যা দিয়েছিলেন)</div><div class="row"><input id="u" placeholder="মোবাইল নম্বর" inputmode="numeric"></div><div class="row"><input id="p" type="password" placeholder="পাসওয়ার্ড"></div><button class="alt" data-a="login" style="width:100%">প্রবেশ করুন</button></div>`; }
function uidView(u) {
  $('root').innerHTML = `<div class="card" id="login"><h2 style="margin-top:0">এই Gmail এখনো অ্যাডমিন হিসেবে যুক্ত নেই</h2><p>আপনি <b>${esc(u.email || u.uid)}</b> দিয়ে ঢুকেছেন।</p><ol style="padding-left:20px"><li>ওয়েবসাইটের ঠিকানার শেষে <b>/#setup</b> যোগ করে খুলুন</li><li>ঘরে এই Gmail লিখুন: <b>${esc(u.email || '')}</b></li><li>"নিয়ম কপি করুন" চাপুন</li><li>Firebase → Firestore Database → Rules-এ সব মুছে বসান ও <b>Publish</b> দিন</li><li>এই পাতা রিফ্রেশ করুন, সরাসরি প্যানেল খুলবে</li></ol><button class="alt" data-a="out" style="width:100%">লগ আউট</button><details style="margin-top:12px"><summary style="color:var(--mut)">পুরনো পদ্ধতি (UID দিয়ে)</summary><p style="color:var(--mut);font-size:14px">Firestore-এ admins কালেকশনে এই UID ডকুমেন্ট আইডি দিয়ে ok = true বসালেও চলে:</p><input id="uid" readonly value="${u.uid}"><div class="row"><button data-a="cuid">কোড কপি করুন</button></div></details></div>`;
}
A.cuid = async () => { try { await navigator.clipboard.writeText(auth.currentUser.uid); alert('কপি হয়েছে'); } catch { $('uid').select(); } };
A.glogin = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    const m = { 'auth/popup-blocked': 'ব্রাউজার পপআপ আটকে দিয়েছে। পপআপের অনুমতি দিয়ে আবার চাপুন', 'auth/unauthorized-domain': 'Firebase → Authentication → Settings → Authorized domains-এ এই সাইটের ঠিকানা যোগ করুন', 'auth/operation-not-allowed': 'Firebase → Authentication → Sign-in method-এ Google চালু করুন', 'auth/popup-closed-by-user': '' };
    loginView(e.code in m ? m[e.code] : 'Google লগইন হয়নি (' + (e.code || 'অজানা') + ')');
  }
};
A.login = async () => { const u = $('u').value.trim(); try { await signInWithEmailAndPassword(auth, u.includes('@') ? u : u + '@mathar.app', $('p').value); } catch { loginView('নম্বর বা পাসওয়ার্ড ভুল'); } };
const T = [['posts', '🛒 পোস্ট (এলাকা অনুযায়ী)'], ['dash', '📊 ড্যাশবোর্ড'], ['users', '👥 সদস্য'], ['mod', '🚫 নীতিমালা ও রিপোর্ট'], ['ann', '📢 ঘোষণা (পপআপ)'], ['qs', '🌱 প্রশ্ন'], ['prices', '💰 বাজার দর']];
function shell() { $('root').innerHTML = `<div class="wrap"><aside><h2>🌾 মাঠের হাট</h2>${T.map(t => `<a data-a="tab" data-v="${t[0]}" class="${t[0] === TAB ? 'on' : ''}">${t[1]}</a>`).join('')}<a data-a="out">⎋ বের হন</a></aside><main id="m">লোড হচ্ছে…</main></div>`; V[TAB](); }
A.tab = v => { TAB = v; shell(); }; A.out = () => signOut(auth);

/* ---------- স্বয়ংক্রিয় পরিষ্কার: অ্যাডমিন প্যানেল খুললেই চলে ---------- */
async function rmPost(p, reason) {
  await deleteDoc(doc(db, 'products', p.id));
  if (reason) await addDoc(col('violations'), { uid: p.sellerId, name: p.sellerName, title: p.title, reason, at: serverTimestamp() }).catch(() => {});
}
async function sweep() {
  let n = 0;
  for (const p of await rows('products', 'createdAt', 100)) if (BAD.test((p.title || '') + ' ' + (p.description || ''))) { await rmPost(p, 'অটো-ডিলিট: নিষিদ্ধ শব্দ'); n++; }
  const c = {}; (await getDocs(col('reports'))).docs.forEach(d => { const r = d.data(); c[r.pid] = (c[r.pid] || 0) + 1; });
  for (const pid in c) if (c[pid] >= 3) { const s = await getDoc(doc(db, 'products', pid)); if (s.exists()) { await rmPost({ id: pid, ...s.data() }, 'অটো-ডিলিট: ৩+ রিপোর্ট'); n++; } }
  const v = {}; (await getDocs(col('violations'))).docs.forEach(d => { const x = d.data(); v[x.uid] = (v[x.uid] || 0) + 1; });
  for (const id in v) if (v[id] >= 3) await updateDoc(doc(db, 'users', id), { banned: true }).catch(() => {});
  return n;
}

/* ---------- পোস্ট: বিভাগ → জেলা → উপজেলা ফিল্টার ---------- */
const uniq = a => [...new Set(a.filter(Boolean))].sort();
const sel = (c, arr, cur, ph) => `<select data-c="${c}"><option value="">${ph}</option>${arr.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
V.posts = async () => { PL = await rows('products', 'createdAt', 100); drawPosts(); };
function drawPosts() {
  const byV = PL.filter(p => !FIL.v || p.division === FIL.v), byD = byV.filter(p => !FIL.d || p.district === FIL.d), L = byD.filter(p => !FIL.u || p.upazila === FIL.u), cnt = {};
  byD.forEach(p => cnt[p.upazila] = (cnt[p.upazila] || 0) + 1);
  $('m').innerHTML = `<h2>পোস্ট (${L.length}টি)</h2><div class="card"><div class="row">${sel('fv', uniq(PL.map(p => p.division)), FIL.v, 'সব বিভাগ')}${sel('fd', uniq(byV.map(p => p.district)), FIL.d, 'সব জেলা')}${sel('fu', uniq(byD.map(p => p.upazila)), FIL.u, 'সব উপজেলা')}</div><div>উপজেলা অনুযায়ী: ${Object.entries(cnt).map(([u, n]) => `<span class="tag" style="cursor:pointer;margin:2px" data-a="fu" data-v="${esc(u)}">${esc(u)}: ${n}</span>`).join('') || '—'}</div></div>
<div class="card"><table><tr><th></th><th>পণ্য</th><th>বিক্রেতা ও এলাকা</th><th>অবস্থা</th><th></th></tr>${L.map(p => `<tr><td>${p.images?.[0] ? `<img class="th" src="${esc(p.images[0])}" alt="">` : ''}</td><td>${esc(p.title)}<br><small>${esc(p.category)} • ৳${p.price}/${esc(p.unit)}<br>${esc(p.description || '').slice(0, 80)}</small></td><td>${esc(p.sellerName)}<br><small>${esc(p.upazila)}, ${esc(p.district)}, ${esc(p.division)}</small></td><td><span class="tag">${p.status === 'active' ? 'চালু' : 'লুকানো'}</span></td>
<td><button class="alt" data-a="pst" data-v="${p.id}|${p.status === 'active' ? 'hidden' : 'active'}">${p.status === 'active' ? 'লুকান' : 'চালু'}</button> <button class="del" data-a="pdel" data-v="${p.id}|0">মুছুন</button> <button class="del" data-a="pdel" data-v="${p.id}|1" title="মুছে বিক্রেতাকে সতর্ক করুন">🚫 ১৮+</button></td></tr>`).join('') || '<tr><td colspan="5">কোনো পোস্ট নেই</td></tr>'}</table></div>`;
}
A.fv = v => { FIL = { v, d: '', u: '' }; drawPosts(); }; A.fd = v => { FIL.d = v; FIL.u = ''; drawPosts(); }; A.fu = v => { FIL.u = v; drawPosts(); };
A.pst = async v => { const [id, s] = v.split('|'); await updateDoc(doc(db, 'products', id), { status: s }); PL.find(x => x.id === id).status = s; drawPosts(); };
A.pdel = async v => { const [id, strike] = v.split('|'), p = PL.find(x => x.id === id); if (!confirm(strike === '1' ? 'পোস্ট মুছে বিক্রেতার নামে স্ট্রাইক দেবেন? (৩ স্ট্রাইকে অ্যাকাউন্ট বন্ধ)' : 'পোস্ট মুছবেন?')) return; await rmPost(p, strike === '1' ? 'অ্যাডমিন: ১৮+/নীতিবিরোধী' : ''); PL = PL.filter(x => x.id !== id); TAB === 'mod' ? V.mod() : drawPosts(); };

V.dash = async () => {
  const c = async q => (await getCountFromServer(q)).data().count;
  const [u, p, o, q, v, r] = await Promise.all([c(col('users')), c(col('products')), c(col('orders')), c(query(col('questions'), where('answer', '==', ''))), c(col('violations')), c(col('reports'))]);
  $('m').innerHTML = `<h2>ড্যাশবোর্ড</h2><div class="stats">${[['সদস্য', u], ['পোস্ট', p], ['অর্ডার', o], ['উত্তরহীন প্রশ্ন', q], ['নীতিভঙ্গের লগ', v], ['রিপোর্ট', r]].map(x => `<div class="card stat"><b>${x[1]}</b>${x[0]}</div>`).join('')}</div>`;
};
V.users = async () => {
  const L = await rows('users'), vs = await rows('violations', 'at', 500), c = {}; vs.forEach(v => c[v.uid] = (c[v.uid] || 0) + 1);
  $('m').innerHTML = `<h2>সদস্য</h2><div class="card"><table><tr><th>নাম</th><th>মোবাইল</th><th>এলাকা</th><th>ধরন</th><th>নীতিভঙ্গ</th><th></th></tr>${L.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>${esc(u.village ? u.village + ', ' : '')}${esc(u.upazila)}, ${esc(u.district)}</td><td>${esc(u.type)}</td><td>${c[u.id] || 0}</td><td><button class="${u.banned ? '' : 'del'}" data-a="ban" data-v="${u.id}|${u.banned ? 0 : 1}">${u.banned ? 'চালু করুন' : 'বন্ধ করুন'}</button></td></tr>`).join('')}</table></div>`;
};
A.ban = async v => { const [id, b] = v.split('|'); await updateDoc(doc(db, 'users', id), { banned: b === '1' }); V.users(); };
V.mod = async () => {
  const vs = await rows('violations', 'at', 100), c = {}; (await getDocs(col('reports'))).docs.forEach(d => { const r = d.data(); c[r.pid] = (c[r.pid] || 0) + 1; });
  const it = (await Promise.all(Object.keys(c).map(async pid => { const s = await getDoc(doc(db, 'products', pid)); return s.exists() ? { id: pid, ...s.data(), n: c[pid] } : null; }))).filter(Boolean);
  PL = it;
  $('m').innerHTML = `<h2>নীতিমালা ও রিপোর্ট</h2><div class="card"><h3>🚩 রিপোর্ট হওয়া পোস্ট (৩টি রিপোর্টে অটো-ডিলিট)</h3>${it.map(p => `<div style="padding:6px 0;border-bottom:1px solid var(--bd)">${p.images?.[0] ? `<img class="th" src="${esc(p.images[0])}" alt=""> ` : ''}<b>${esc(p.title)}</b> • ${esc(p.upazila)} • ${p.n}টি রিপোর্ট <button class="del" data-a="pdel" data-v="${p.id}|1">🚫 মুছুন</button> <button class="alt" data-a="rclr" data-v="${p.id}">ঠিক আছে</button></div>`).join('') || '<p>কিছু নেই</p>'}</div>
<div class="card"><h3>বাতিল ও মুছে ফেলা পোস্টের লগ</h3><table><tr><th>সময়</th><th>বিক্রেতা</th><th>পোস্ট</th><th>কারণ</th></tr>${vs.map(l => `<tr><td>${dt(l.at)}</td><td>${esc(l.name)}</td><td>${esc(l.title)}</td><td>${esc(l.reason)}</td></tr>`).join('') || '<tr><td colspan="4">কিছু নেই</td></tr>'}</table></div>`;
};
A.rclr = async pid => { const s = await getDocs(query(col('reports'), where('pid', '==', pid))); for (const d of s.docs) await deleteDoc(d.ref); V.mod(); };
V.ann = async () => {
  const L = await rows('announcements', 'at', 20);
  $('m').innerHTML = `<h2>ঘোষণা (সবার ফোনে পপআপ)</h2><div class="card"><div class="row"><input id="at" placeholder="শিরোনাম (যেমন: আজ ধানের দাম বেড়েছে)"></div><div class="row"><textarea id="ax" rows="3" placeholder="বিস্তারিত…"></textarea></div><button data-a="aadd">সবাইকে পাঠান</button><p style="color:var(--mut)">যাদের সাইট এখন খোলা আছে তারা সাথে সাথে পপআপ পাবেন, বাকিরা সাইটে ঢুকলে পাবেন।</p></div><div class="card"><table><tr><th>সময়</th><th>ঘোষণা</th><th></th></tr>${L.map(x => `<tr><td>${dt(x.at)}</td><td><b>${esc(x.title)}</b><br>${esc(x.text)}</td><td><button class="del" data-a="adel" data-v="${x.id}">মুছুন</button></td></tr>`).join('') || '<tr><td colspan="3">কোনো ঘোষণা নেই</td></tr>'}</table></div>`;
};
A.aadd = async () => { const t = $('at').value.trim(); if (!t) return alert('শিরোনাম দিন'); await addDoc(col('announcements'), { title: t.slice(0, 80), text: $('ax').value.trim().slice(0, 300), at: serverTimestamp() }); V.ann(); };
A.adel = async id => { await deleteDoc(doc(db, 'announcements', id)); V.ann(); };
V.qs = async () => {
  const L = await rows('questions', 'createdAt', 50);
  $('m').innerHTML = `<h2>কৃষকের প্রশ্ন</h2>${L.map(q => `<div class="card"><b>${esc(q.text)}</b><div style="color:var(--mut)">${dt(q.createdAt)}</div><textarea id="a_${q.id}" rows="3" style="margin-top:8px" placeholder="উত্তর লিখুন…">${esc(q.answer)}</textarea><div class="row"><button data-a="qs" data-v="${q.id}">উত্তর প্রকাশ</button><button class="del" data-a="qdel" data-v="${q.id}">মুছুন</button></div></div>`).join('') || '<p>কোনো প্রশ্ন নেই</p>'}`;
};
A.qs = async id => { await updateDoc(doc(db, 'questions', id), { answer: $('a_' + id).value.trim(), answeredBy: 'admin', answeredAt: serverTimestamp() }); alert('প্রকাশিত'); };
A.qdel = async id => { if (confirm('মুছবেন?')) { await deleteDoc(doc(db, 'questions', id)); V.qs(); } };
V.prices = async () => {
  const L = await rows('prices', 'createdAt', 50);
  $('m').innerHTML = `<h2>বাজার দর</h2><div class="card"><div class="row"><input id="pc" placeholder="পণ্য (যেমন: আমন ধান)"><input id="pm" placeholder="বাজার (যেমন: নেত্রকোনা)"><input id="pp" type="number" placeholder="দাম ৳"><input id="pu" placeholder="একক (মণ/কেজি)"></div><button data-a="padd">দর যোগ করুন</button></div><div class="card"><table><tr><th>পণ্য</th><th>বাজার</th><th>দাম</th><th>তারিখ</th><th></th></tr>${L.map(p => `<tr><td>${esc(p.crop)}</td><td>${esc(p.market)}</td><td>৳${p.price}/${esc(p.unit)}</td><td>${dt(p.createdAt)}</td><td><button class="del" data-a="pdl" data-v="${p.id}">মুছুন</button></td></tr>`).join('')}</table></div>`;
};
A.padd = async () => { const p = +$('pp').value; if (!$('pc').value.trim() || !p) return alert('পণ্য ও দাম দিন'); await addDoc(col('prices'), { crop: $('pc').value.trim(), market: $('pm').value.trim(), price: p, unit: $('pu').value.trim() || 'মণ', createdAt: serverTimestamp() }); V.prices(); };
A.pdl = async id => { await deleteDoc(doc(db, 'prices', id)); V.prices(); };
</script>
</body>
</html>
