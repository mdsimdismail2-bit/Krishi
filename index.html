  if (!('speechSynthesis' in window)) return toast('এই ফোনে ভয়েস সমর্থিত নয়');
  const ss = speechSynthesis, was = SPK, same = speak.last === txt, id = ++speak.id;
  ss.cancel(); SPK = false; 
  if (was && same) return;

  const clean = String(txt || '').replace(/[\p{Extended_Pictographic}\uFE0F\u200d]/gu, ' ').replace(/[→•|]/g, ', ').replace(/\s+/g, ' ').trim(); if (!clean) return;

  parts.forEach(p => { if ((cur + p).length > 170) { if (cur) chunks.push(cur); cur = p; } else cur += p; }); if (cur) chunks.push(cur);
  const v = ss.getVoices().find(x => /^bn/i.test(x.lang));
  if (!v && !speak.warned) { speak.warned = 1; toast('বাংলা ভয়েস না পেলে ফোনের Settings → Text-to-speech-এ বাংলা যোগ করুন'); }

service cloud.firestore {

    function me() { return get(/databases/$(db)/documents/users/$(request.auth.uid)).data; }

    function near(p) {

        (p.scope == 'district' || me().upazila == p.upazila)));

      return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status', 'updatedAt']);

    match /admins/{a} { allow read: if mine(a); }

    match /users/{u} {

        && request.resource.data.type in ['retail', 'wholesale', 'both'];

        && request.resource.data.images.size() >= 1 && request.resource.data.images.size() <= 3
        && request.resource.data.images[0] is string
        && request.resource.data.scope in ['upazila', 'district', 'division', 'country']
        && request.resource.data.saleType in ['retail', 'wholesale', 'both']
        && request.resource.data.division == me().division
        && request.resource.data.district == me().district
        && request.resource.data.upazila == me().upazila;
      // মালিক শুধু দাম ও পরিমাণ বদলাতে পারবে
      allow update: if adm() || (mine(resource.data.sellerId)

           .hasOnly(['price', 'qty', 'wholesalePrice', 'minWholesaleQty', 'updatedAt']));

    }

    match /orders/{o} {
      allow read: if adm() || mine(resource.data.buyerId) || mine(resource.data.sellerId);
      allow create: if si() && request.resource.data.buyerId == request.auth.uid
        && request.resource.data.sellerId != request.auth.uid
        && request.resource.data.status == 'requested'
        && request.resource.data.mode in ['retail', 'wholesale'];
      allow update: if adm() || (onlyStatus() && (
        (mine(resource.data.sellerId) && request.resource.data.status in ['confirmed', 'shipped', 'delivered', 'cancelled']) ||
        (mine(resource.data.buyerId) && resource.data.status == 'requested' && request.resource.data.status == 'cancelled')));
    }

    match /chats/{c} {
      allow read: if adm() || (si() && request.auth.uid in resource.data.members);
      allow create: if si() && request.auth.uid in request.resource.data.members
        && request.resource.data.members.size() == 2;
      allow update: if si() && request.auth.uid in resource.data.members;
      match /messages/{m} {
        allow read: if si() && request.auth.uid in get(/databases/$(db)/documents/chats/$(c)).data.members;
        allow create: if si() && request.resource.data.from == request.auth.uid
          && request.resource.data.text.size() <= 1000
          && request.auth.uid in get(/databases/$(db)/documents/chats/$(c)).data.members;
      }
    }

    match /questions/{q} {
      allow read: if si();
      allow create: if si() && request.resource.data.uid == request.auth.uid && request.resource.data.answer == '';
      allow update, delete: if adm();
    }
    match /announcements/{a} { allow read: if si(); allow write: if adm(); }
    match /prices/{p} { allow read: if si(); allow write: if adm(); }

    // নীতিমালা: রিপোর্ট ও লগ
    match /reports/{r} {
      allow create: if si() && request.resource.data.uid == request.auth.uid
        && r == request.resource.data.pid + '_' + request.auth.uid;
      allow read, delete: if adm();
    }
    match /violations/{v} {
      allow create: if si() && (request.resource.data.uid == request.auth.uid || adm());
      allow read, delete: if adm();
    }
  }
}
` };
function setup() {
  let sv = ''; try { sv = localStorage.getItem('adm') || ''; } catch { }
  $('app').innerHTML = `<h2>⚙️ প্রথম সেটআপ</h2><div class="card"><h3>ধাপ ১: আপনার Gmail</h3><p class="mut">এই Gmail দিয়েই অ্যাডমিন প্যানেলে সরাসরি ঢুকতে পারবেন। একাধিক হলে কমা দিয়ে লিখুন।</p><input id="ge" type="email" placeholder="example@gmail.com" value="${esc(sv)}"></div><div class="card"><h3>ধাপ ২: নিয়ম কপি করুন</h3><p class="mut">কপি করে Firebase → Firestore Database → Rules ট্যাবে সব মুছে বসান এবং Publish দিন। Storage লাগবে না।</p><button data-a="cp" data-v="fs">নিয়ম কপি করুন</button></div>`;
}
A.cp = async () => {
  const em = $('ge').value.toLowerCase().split(/[\s,]+/).filter(x => /^[^@\s'"\\]+@[^@\s'"\\]+\.[^@\s'"\\]+$/.test(x));
  if (!em.length) return toast('আগে আপনার Gmail লিখুন');
  try { localStorage.setItem('adm', em.join(', ')); } catch { }
  try { await navigator.clipboard.writeText(RULES.fs.replace("'__ADMIN_EMAIL__'", em.map(x => `'${x}'`).join(', '))); toast('কপি হয়েছে ✅ এবার Firebase-এ বসান'); } catch { toast('কপি করা যায়নি'); }
};

A.rep = async id => { if (!confirm('এই পোস্টটি অনুপযুক্ত (১৮+ বা কৃষি-বহির্ভূত) বলে রিপোর্ট করবেন?')) return; try { await setDoc(doc(db, 'reports', id + '_' + UID), { pid: id, uid: UID, at: serverTimestamp() }); toast('রিপোর্ট জমা হয়েছে, ধন্যবাদ'); } catch { toast('রিপোর্ট করা যায়নি'); } };
</script>
